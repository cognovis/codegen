name: PR changed-line lint
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.event.pull_request.draft == false
    runs-on: atlas
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: https://github.com/astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Build diagnostics without credentials
        env:
          GITHUB_TOKEN: ""
          GITEA_TOKEN: ""
        run: |
          git diff --name-only -z --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- '*.py' > changed-python-files
          adapter_path=""
          for candidate in .agents/skills/cognovis-pr/scripts/python_diagnostics.py .claude/skills/cognovis-pr/scripts/python_diagnostics.py skills/cognovis-pr/scripts/python_diagnostics.py "$HOME/.agents/skills/cognovis-pr/scripts/python_diagnostics.py" "$HOME/.claude/skills/cognovis-pr/scripts/python_diagnostics.py"; do
            if test -f "$candidate"; then
              adapter_path="$candidate"
              break
            fi
          done
          test -n "$adapter_path"
          filter_path=""
          for candidate in .agents/skills/cognovis-pr/scripts/changed_line_filter.py .claude/skills/cognovis-pr/scripts/changed_line_filter.py skills/cognovis-pr/scripts/changed_line_filter.py "$HOME/.agents/skills/cognovis-pr/scripts/changed_line_filter.py" "$HOME/.claude/skills/cognovis-pr/scripts/changed_line_filter.py"; do
            if test -f "$candidate"; then
              filter_path="$candidate"
              break
            fi
          done
          test -n "$filter_path"
          uv run --no-project python "$adapter_path" collect --changed-files changed-python-files --json-output lint-reviewdog.json --repo-root . --select E9,F
          uv run --no-project python "$adapter_path" --repo-root . lint-reviewdog.json > lint-reviewdog.unfiltered.txt
          uv run --no-project python "$filter_path" --base-sha "${{ github.event.pull_request.base.sha }}" --head-sha "${{ github.event.pull_request.head.sha }}" --repo-root . --input lint-reviewdog.unfiltered.txt > lint-reviewdog.txt
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: reviewdog-diagnostics
          path: lint-reviewdog.txt
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: diagnostics
    runs-on: atlas
    steps:
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: reviewdog-diagnostics
      - name: Validate diagnostic artifact
        run: |
          diagnostic_size="$(wc -c < lint-reviewdog.txt)"
          if test "$diagnostic_size" -gt 262144; then
            echo "Diagnostic artifact exceeds 262144 bytes" >&2
            exit 2
          fi
          awk '
            length($0) > 4096 { exit 1 }
            $0 !~ /^[A-Za-z0-9_.\/-]+:[1-9][0-9]*:[1-9][0-9]*: error [A-Za-z0-9_-]+: [[:print:]]+$/ { exit 1 }
            {
              split($0, fields, ":")
              if (fields[1] ~ /^\// || fields[1] ~ /(^|\/)\.\.(\/|$)/) exit 1
            }
          ' lint-reviewdog.txt || {
            echo "Diagnostic artifact has an unsafe line" >&2
            exit 2
          }
      - name: Initialize empty reviewdog metadata
        run: |
          metadata_home="$RUNNER_TEMP/reviewdog-empty-home"
          mkdir -p "$metadata_home"
          HOME="$metadata_home" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            git -c init.templateDir= init --quiet .
          tracked_paths="$(HOME="$metadata_home" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git ls-files)"
          if test -n "$tracked_paths"; then
            echo "Reviewdog metadata repository must not contain tracked files" >&2
            exit 2
          fi
      - uses: https://github.com/reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f
        with:
          reviewdog_version: v0.21.0
      - id: reviewdog
        run: |
          reviewdog_path="$RUNNER_TEMP/reviewdog/bin/reviewdog"
          if ! test -x "$reviewdog_path"; then
            echo "The action-installed reviewdog executable is unavailable" >&2
            exit 2
          fi
          printf 'path=%s\n' "$reviewdog_path" >> "$GITHUB_OUTPUT"
      - name: Publish findings
        env:
          REVIEWDOG_GITEA_API_TOKEN: ${{ secrets.REVIEWDOG_TOKEN }}
          GITEA_ADDRESS: ${{ github.server_url }}
          CI_PULL_REQUEST: ${{ github.event.pull_request.number }}
          CI_COMMIT: ${{ github.event.pull_request.head.sha }}
          CI_REPO_OWNER: ${{ github.repository_owner }}
          CI_REPO_NAME: ${{ github.event.repository.name }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          test -n "$REVIEWDOG_GITEA_API_TOKEN"
          "${{ steps.reviewdog.outputs.path }}" \
            -efm='%f:%l:%c: %t%*[^:]: %m' \
            -reporter=gitea-pr-review \
            -filter-mode=nofilter \
            -fail-level=error \
            < lint-reviewdog.txt
