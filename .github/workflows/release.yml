name: Canary & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  canary-release:
    # Skip if commit message contains [skip ci] or starts with "chore: release"
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore: release') &&
      !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: make test

      - name: Build
        run: bun run build

      - name: Generate canary version
        id: version
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          CANARY_VERSION_SUFFIX="-canary.${TIMESTAMP}.${COMMIT_SHA}"
          echo "canary_version_suffix=${CANARY_VERSION_SUFFIX}" >> $GITHUB_OUTPUT
          echo "Generated canary version suffix: ${CANARY_VERSION_SUFFIX}"

      - name: Update package.json version
        run: |
          bun --bun -e "
            const pkg = require('./package.json');
            pkg.version = pkg.version + '${{ steps.version.outputs.canary_version_suffix }}';
            console.log('Canary version:', pkg.version);
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://npm.cognovis.de"
          scope: "@cognovis"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish canary release
        run: npm publish --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.COGNOVIS_NPM_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: make test

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://npm.cognovis.de"
          scope: "@cognovis"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Validate release tag and package
        id: release
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack release artifact
        id: package
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .release-artifacts
          npm pack --ignore-scripts --json --pack-destination .release-artifacts > .release-artifacts/pack.json
          TARBALL="$(node -e '
            const pack = require("./.release-artifacts/pack.json");
            const candidate = pack[0];
            if (!candidate || candidate.name !== process.env.PACKAGE_NAME || candidate.version !== process.env.VERSION)
              throw new Error(`Packed manifest must be ${process.env.PACKAGE_NAME}@${process.env.VERSION}`);
            process.stdout.write(`.release-artifacts/${candidate.filename}`);
          ')"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "shasum=$(node -e 'const pack = require("./.release-artifacts/pack.json"); process.stdout.write(pack[0].shasum)')" >> "$GITHUB_OUTPUT"
          echo "integrity=$(node -e 'const pack = require("./.release-artifacts/pack.json"); process.stdout.write(pack[0].integrity)')" >> "$GITHUB_OUTPUT"

      - name: Verify packed release artifact
        shell: bash
        run: bash scripts/verify-release-tarball.sh "${{ steps.package.outputs.tarball }}" "$GITHUB_WORKSPACE/test/assets/profile-sliced-choice"

      - name: Detect existing release
        id: release-state
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.COGNOVIS_NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          VERSION: ${{ steps.release.outputs.version }}
          PACK_SHASUM: ${{ steps.package.outputs.shasum }}
          PACK_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          set -euo pipefail
          set +e
          npm view "$PACKAGE_NAME@$VERSION" dist --json > .release-artifacts/existing-dist.json 2> .release-artifacts/existing-dist.err
          lookup_status=$?
          set -e

          if test "$lookup_status" = 0; then
            node -e '
              const dist = require("./.release-artifacts/existing-dist.json");
              if (dist.shasum !== process.env.PACK_SHASUM || dist.integrity !== process.env.PACK_INTEGRITY)
                throw new Error("Existing package bytes do not match the freshly packed release candidate");
            '
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if rg -q "E404" .release-artifacts/existing-dist.err; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat .release-artifacts/existing-dist.err >&2
          exit "$lookup_status"

      - name: Publish release
        if: steps.release-state.outputs.already_published != 'true'
        run: npm publish "${{ steps.package.outputs.tarball }}" --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.COGNOVIS_NPM_TOKEN }}

      - name: Verify published package identity
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.COGNOVIS_NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          VERSION: ${{ steps.release.outputs.version }}
          PACK_SHASUM: ${{ steps.package.outputs.shasum }}
          PACK_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          set -euo pipefail
          package_visible=false
          for attempt in $(seq 1 5); do
            if npm view "$PACKAGE_NAME@$VERSION" dist --json > .release-artifacts/registry-dist.json 2>> .release-artifacts/registry-dist.err && \
              node -e 'const dist = require("./.release-artifacts/registry-dist.json"); process.exit(dist.shasum === process.env.PACK_SHASUM && dist.integrity === process.env.PACK_INTEGRITY ? 0 : 1)'; then
              package_visible=true
              break
            fi
            sleep 2
          done
          test "$package_visible" = true

          latest_visible=false
          for attempt in $(seq 1 5); do
            if test "$(npm view "$PACKAGE_NAME" dist-tags.latest 2>> .release-artifacts/latest-dist-tag.err)" = "$VERSION"; then
              latest_visible=true
              break
            fi
            sleep 2
          done
          test "$latest_visible" = true

          REGISTRY_SHASUM="$(node -e 'const dist = require("./.release-artifacts/registry-dist.json"); process.stdout.write(dist.shasum)')"
          REGISTRY_INTEGRITY="$(node -e 'const dist = require("./.release-artifacts/registry-dist.json"); process.stdout.write(dist.integrity)')"
          TARBALL_URL="$(node -e 'const dist = require("./.release-artifacts/registry-dist.json"); process.stdout.write(dist.tarball)')"
          test "$REGISTRY_SHASUM" = "$PACK_SHASUM"
          test "$REGISTRY_INTEGRITY" = "$PACK_INTEGRITY"

          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --header "Authorization: Bearer $NODE_AUTH_TOKEN" \
            "$TARBALL_URL" --output .release-artifacts/downloaded.tgz
          DOWNLOADED_SHASUM="$(shasum -a 1 .release-artifacts/downloaded.tgz | awk '{print $1}')"
          DOWNLOADED_INTEGRITY="$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(".release-artifacts/downloaded.tgz")).digest("base64")}`)')"
          test "$DOWNLOADED_SHASUM" = "$PACK_SHASUM"
          test "$DOWNLOADED_INTEGRITY" = "$PACK_INTEGRITY"

          RELEASE_COMMIT="$(git rev-parse HEAD)"
          export PACKAGE_NAME VERSION RELEASE_COMMIT REGISTRY_SHASUM REGISTRY_INTEGRITY TARBALL_URL DOWNLOADED_SHASUM DOWNLOADED_INTEGRITY
          node -e '
            const { writeFileSync } = require("node:fs");
            writeFileSync(".release-artifacts/release-evidence.json", JSON.stringify({
              package: process.env.PACKAGE_NAME,
              version: process.env.VERSION,
              commit: process.env.RELEASE_COMMIT,
              local: { shasum: process.env.PACK_SHASUM, integrity: process.env.PACK_INTEGRITY },
              registry: { shasum: process.env.REGISTRY_SHASUM, integrity: process.env.REGISTRY_INTEGRITY, tarball: process.env.TARBALL_URL },
              downloaded: { shasum: process.env.DOWNLOADED_SHASUM, integrity: process.env.DOWNLOADED_INTEGRITY },
            }, null, 2));
          '
          {
            echo "## Published package identity"
            echo "- Package: \`$PACKAGE_NAME@$VERSION\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- shasum: \`$REGISTRY_SHASUM\`"
            echo "- integrity: \`$REGISTRY_INTEGRITY\`"
            echo "- Registry tarball: \`$TARBALL_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegen-${{ github.ref_name }}-release-evidence
          path: .release-artifacts/
          if-no-files-found: warn

      - name: Create Github Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
