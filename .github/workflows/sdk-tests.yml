name: Test SDKs
permissions:
  contents: read

on:
  push:
  pull_request:

# Only PR runs cancel active duplicates; default-branch pushes stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref_type }}-${{ github.head_ref || github.ref_name }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# External workflows require approval in repository settings.
# Default fork routing uses GitHub hosts; internal jobs use our runners.
jobs:
  test-csharp-sdk:
    # This credentialed Aidbox test needs a fresh Docker host and fixed port.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test csharp-sdk
        run: |
          export AIDBOX_LICENSE_ID="${{ secrets.AIDBOX_LICENSE_ID }}"
          make test-csharp-sdk

      - name: Repository contains actual csharp-sdk version
        run: |
          diff_result=$(git diff --exit-code --name-only examples/csharp/generated || true)

          if [ -z "$diff_result" ]; then
            echo "✅ Generated SDK is identical to the one stored in repository."
          else
            echo "❌ Generated SDK differs from the one stored in repository."
            echo "Differences:"
            git diff examples/csharp/generated
            exit 1
          fi

  test-typescript-r4-us-core-example:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "docker"]') }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: make test-typescript-r4-us-core-example

      - name: Repository contains actual typescript-sdk version
        run: |
          diff_result=$(git diff --exit-code --name-only examples/typescript-r4-us-core || true)

          if [ -z "$diff_result" ]; then
            echo "✅ Generated SDK is identical to the one stored in repository."
          else
            echo "❌ Generated SDK differs from the one stored in repository."
            echo "Differences:"
            git diff examples/typescript-r4-us-core
            exit 1
          fi

  test-python-sdk:
    # This credentialed Aidbox test needs a fresh Docker host and fixed port.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Python SDK
        run: |
          export AIDBOX_LICENSE_ID="${{ secrets.AIDBOX_LICENSE_ID }}"
          make test-python-sdk

  test-python-r4-us-core-example:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "docker"]') }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: make test-python-r4-us-core-example

      - name: Repository contains actual python-sdk version
        run: |
          diff_result=$(git diff --exit-code --name-only examples/python-r4-us-core/fhir_types || true)

          if [ -z "$diff_result" ]; then
            echo "✅ Generated SDK is identical to the one stored in repository."
          else
            echo "❌ Generated SDK differs from the one stored in repository."
            echo "Differences:"
            git diff examples/python-r4-us-core/fhir_types
            exit 1
          fi

  test-typescript-custom-packages-example:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "docker"]') }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: make test-typescript-custom-packages-example

  test-on-the-fly-example:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "docker"]') }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: make test-on-the-fly-example

  test-mustache-java-r4-example:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "docker"]') }}

    strategy:
      matrix:
        java-version: [21, 25]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: make test-mustache-java-r4-example
