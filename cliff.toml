# git-cliff configuration — changelog from conventional commits
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
Generated by [git-cliff](https://git-cliff.org) from conventional commits.
"""
# template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first | trim }}\
            {% if commit.breaking %} [**breaking**]{% endif %} \
            ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}
{% endfor %}
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove the leading and trailing whitespace
trim = true

[git]
# Consider only this fork's own release lineage.
#
# A synchronization fetches upstream with a plain `git fetch`, which brings
# upstream's release tags into the shared repository. Without this pattern
# git-cliff ranks `v0.0.21` alongside the fork's `v0.2.4` and
# `--bumped-version` answers `v0.0.22`, which `scripts/release.sh` would then
# publish as `latest` — moving the dist-tag backwards.
#
# Matched:   v0.1.0 … v0.2.4, v0.3.0, v0.10.0, v1.0.0, v999.x.y, with an
#            optional prerelease suffix.
# Excluded:  upstream's `v0.0.*` line (minor 0 never matches), the calendar
#            tags `v2026.04.*` (a major is at most three digits), and anything
#            not shaped like `v<semver>` such as `cognovis/v2026.05.0`,
#            `archive/*` and `untagged-*`.
tag_pattern = '^v(0\.[1-9][0-9]*\.[0-9]+|[1-9][0-9]{0,2}\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$'
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
]
# regex for parsing and grouping commits
commit_parsers = [
  { message = '^feat', group = "<!-- 0 -->Features" },
  { message = '^fix', group = "<!-- 1 -->Bug Fixes" },
  { message = '^perf', group = "<!-- 2 -->Performance" },
  { message = '^refactor', group = "<!-- 3 -->Refactoring" },
  { message = '^docs', group = "<!-- 4 -->Documentation" },
  { message = '^(style|test|build|ci)', group = "<!-- 5 -->Miscellaneous" },
  { message = '^chore\(release\): prepare for', skip = true },
  { message = '^chore: bump version', skip = true },
  { message = '^chore', skip = true },
  { message = '^merge', skip = true },
  { body = '.*security', group = "<!-- 6 -->Security" },
]
# protect breaking changes from being skipped
protect_breaking_commits = true
# filter out the commits that are not matched by commit parsers
filter_commits = false
# sort the tags topologically
topo_order = false
# sort the commits inside sections by newest first
sort_commits = "newest"
